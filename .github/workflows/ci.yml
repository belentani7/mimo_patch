name: Python syntax and installer preflight (partial)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax-and-installer-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile Python (syntax only)
        run: python -m compileall -q .
      - name: Check Termux shell syntax
        run: bash -n install/install_termux.sh
      - name: Verify read-only installer preview
        run: python -m unittest discover -s tests -p 'test_installer_safety.py' -v
# This workflow deliberately does not claim full pytest, integration, security,
# Windows PowerShell 5/7 or real Termux installation verification.
