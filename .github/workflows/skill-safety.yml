name: Sensitive skill truthfulness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fail-closed-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated test requirements
        run: python -m pip install 'pydantic>=2,<3' 'pytest>=8,<10'
      - name: Verify no fabricated external actions
        run: python -m pytest -q tests/test_skill_truthfulness.py
